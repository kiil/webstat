<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF8F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191816" media="(prefers-color-scheme: dark)">
<!-- The install manifest. iOS reads the manifest for the home-screen name and
     icon, but still wants its own apple-touch-icon and the two apple-mobile-*
     hints below to open without Safari's chrome. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Webstat">
<!-- black-translucent lets main's own safe-area padding own the notch. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script type="module" src="{{ datastar_js }}"></script>
<meta name="robots" content="noindex">
<title>Webstat</title>
<style>
:root{--paper:#FBF8F1;--ink:#1E1C19;--muted:#6E675D;--rule:#E4DDD0;--red:#B3141C}
@media (prefers-color-scheme:dark){:root{--paper:#191816;--ink:#F1EDE4;--muted:#A39C90;--rule:#34312C;--red:#E0565C}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 Georgia,"Source Serif 4",serif}
main{max-width:64rem;margin:0 auto;padding:calc(env(safe-area-inset-top) + 2rem) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 4rem) calc(env(safe-area-inset-left) + 16px)}
h1{font-size:2rem;margin:0 0 .25rem;letter-spacing:-.01em}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem}
#bell{font:.8rem system-ui,sans-serif;color:var(--ink);background:none;border:1px solid var(--rule);border-radius:999px;padding:.3rem .7rem;cursor:pointer}
#bell[data-state="denied"]{color:var(--muted);cursor:not-allowed}
.sub{color:var(--muted);font:.85rem system-ui,sans-serif;margin-bottom:2rem}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;margin-bottom:2.5rem}
.tile{border-top:3px solid var(--ink);padding-top:.5rem}
.tile b{display:block;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font:.8rem system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:1fr;gap:2rem}
@media (min-width:800px){.grid{grid-template-columns:2fr 1fr}.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
h2{font-size:.8rem;font:700 .75rem system-ui,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--red);margin:0 0 .5rem}
table{width:100%;border-collapse:collapse;margin-bottom:2rem;font-size:.95rem}
td{padding:.35rem 0;border-bottom:1px solid var(--rule);vertical-align:baseline}
td.n{text-align:right;font-variant-numeric:tabular-nums;width:4.5rem;color:var(--muted)}
td.p{overflow-wrap:anywhere}
th{text-align:right;font:600 .7rem system-ui,sans-serif;color:var(--muted);padding:.25rem 0 .35rem .5rem;border-bottom:1px solid var(--rule)}
th:first-child{text-align:left;padding-left:0}
table.cols td.n{width:3.5rem;padding-left:.5rem}
td.t{color:var(--muted);font:.8rem system-ui,sans-serif;white-space:nowrap;width:3.5rem;text-align:left}
small{color:var(--muted);font:.75rem system-ui,sans-serif}
a{color:inherit}
.live{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:#2E9E5B;margin-right:.35rem;vertical-align:middle;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.offline .live{background:var(--muted);animation:none}
.empty{color:var(--muted)}
td.n.zero{color:var(--red);font-weight:700}
nav{display:flex;flex-wrap:wrap;gap:.25rem 1rem;font:.85rem system-ui,sans-serif;margin-bottom:.75rem}
nav a{color:var(--muted);text-decoration:none}
nav a[aria-current]{color:var(--ink);font-weight:600;border-bottom:2px solid var(--red)}
td.heat{text-align:right;white-space:nowrap;width:1%;padding-left:.75rem;line-height:1;font-size:.95rem}
td.heat i{font-style:normal;display:inline-block;margin-left:-.28em;transform-origin:50% 100%}
td.heat.h0 i{filter:grayscale(1);opacity:.28;font-size:.8em}
td.heat i:nth-child(2){font-size:1.08em}
td.heat i:nth-child(3){font-size:1.16em}
td.heat i:nth-child(4){font-size:1.24em}
td.heat i:nth-child(5){font-size:1.32em}
td.heat.h3 i{filter:drop-shadow(0 0 3px rgba(255,120,0,.35))}
td.heat.h4 i,td.heat.h5 i{filter:drop-shadow(0 0 5px rgba(255,90,0,.6));animation:flicker 1.6s ease-in-out infinite alternate}
td.heat.h5 i{filter:drop-shadow(0 0 7px rgba(255,60,0,.85))}
td.heat i:nth-child(2n){animation-delay:-.5s;animation-duration:1.3s}
td.heat i:nth-child(3n){animation-delay:-.9s;animation-duration:1.9s}
@keyframes flicker{0%{transform:scale(1) rotate(-2deg)}40%{transform:scale(1.07,1.12) rotate(1.5deg)}70%{transform:scale(.97,1.03) rotate(-1deg)}100%{transform:scale(1.05,1.1) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){td.heat i{animation:none!important}}
table.hot{margin-bottom:2.5rem}
small.dom{margin-left:.3rem;opacity:.75;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,18rem),1fr));gap:2rem 1.5rem;align-content:start}
.card{border-top:3px solid var(--ink);padding-top:.6rem;min-width:0}
.card h2{font:700 1.15rem Georgia,"Source Serif 4",serif;text-transform:none;letter-spacing:0;color:var(--ink);margin:0 0 .4rem}
.card h2 a{text-decoration:none}
.card h3{font:700 .7rem system-ui,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--red);margin:.9rem 0 .3rem}
.card table{margin-bottom:0;font-size:.9rem}
.figs{display:flex;flex-wrap:wrap;gap:.2rem 1rem;color:var(--muted);font:.8rem system-ui,sans-serif}
.figs b{color:var(--ink);font:600 1.05rem system-ui,sans-serif;font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:2px;height:2.2rem;margin-top:.7rem}
.spark i{flex:1;max-width:1rem;background:var(--rule);border-radius:1px 1px 0 0;min-height:2px}
.spark i:last-child{background:var(--red)}
.note{color:var(--muted);font:.78rem/1.4 system-ui,sans-serif;margin:-.2rem 0 1rem}
.att{margin-bottom:1.6rem}
.att-head{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;margin-bottom:.3rem}
.att-head small{white-space:nowrap}
.att-marks{position:relative;height:1.15rem}
.att-marks i{position:absolute;transform:translateX(-50%);font:600 .72rem/1 system-ui,sans-serif;font-style:normal;color:var(--muted);cursor:help;bottom:.15rem}
.att-marks i.brake{color:var(--red);font-size:.9rem}
.river{position:relative}
.river svg{display:block;width:100%;height:4.5rem;overflow:visible}
.river .bed{fill:var(--rule);opacity:.45}
.river stop{stop-color:var(--red)}
.river stop.h0{stop-opacity:.1}.river stop.h1{stop-opacity:.24}.river stop.h2{stop-opacity:.4}.river stop.h3{stop-opacity:.58}.river stop.h4{stop-opacity:.78}.river stop.h5{stop-opacity:1}
.river .water{stroke:var(--red);stroke-width:1;vector-effect:non-scaling-stroke}
.river .pin{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3;opacity:.6;vector-effect:non-scaling-stroke}
.river .pin.brake{stroke:var(--ink);stroke-dasharray:none;opacity:1}
.river .band{fill:var(--ink);fill-opacity:0}
.river .band:hover{fill-opacity:.1}
.falls{position:relative;display:flex;justify-content:space-between;height:1rem;margin-top:.25rem;font:600 .7rem/1 system-ui,sans-serif;color:var(--muted);font-variant-numeric:tabular-nums}
.falls i{position:absolute;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-weight:400}
.brake-note{font:.82rem/1.4 system-ui,sans-serif;margin:.35rem 0 0;color:var(--ink)}
table.mods{max-width:26rem}
table.cols td.n{white-space:nowrap}
@media (max-width:600px){table.cols th:nth-child(n+7),table.cols td:nth-child(n+7){display:none}}
</style>
</head>
{%- set q = "?site=" ~ site if site else "" -%}
<body{% if not still %} data-init="@get('/updates{{ q }}')" data-on:refresh="@get('/refresh{{ q }}')"{% endif %}>
<main>
<header><h1>Webstat</h1><button id="bell" type="button" hidden>🔔 Morgenrapport</button></header>
{% if sites | length > 1 %}<nav><a href="/"{% if not site %} aria-current="page"{% endif %}>Alle</a>{% for s in sites %}<a href="/?site={{ s.id }}"{% if s.id == site %} aria-current="page"{% endif %}>{{ s.name }}</a>{% endfor %}</nav>{% endif %}
{{ board | safe }}
</main>
<script>
// The live stream can die silently (a phone leaving the screen, a sleeping
// laptop). Ask for the current board whenever the page comes back, and once
// a minute while it is visible; the patch is idempotent.
let last = 0;
const resync = () => {
  if (Date.now() - last < 500) return;
  last = Date.now();
  document.body.dispatchEvent(new CustomEvent("refresh", {bubbles: true}));
};
addEventListener("focus", resync);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") resync(); });
addEventListener("pageshow", (e) => { if (e.persisted) resync(); });
addEventListener("online", resync);
setInterval(() => { if (document.visibilityState === "visible") resync(); }, 60000);

// Without a network the board is the last one the service worker kept, so the
// live dot must not pulse.
const marked = () => document.documentElement.classList.toggle("offline", !navigator.onLine);
marked();
addEventListener("online", marked);
addEventListener("offline", marked);

// The morning report as a push. Permission is only asked for behind the
// button, never on load. On iOS PushManager exists only in the installed app,
// so in Safari the button stays hidden.
async function announce(reg) {
  const {key} = await fetch("/api/push/key").then((r) => r.json());
  const raw = atob(key.replace(/-/g, "+").replace(/_/g, "/"));
  const sub = (await reg.pushManager.getSubscription()) ?? (await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: Uint8Array.from(raw, (c) => c.charCodeAt(0)),
  }));
  // On every load, not just the first: Chrome rotates endpoints.
  const r = await fetch("/api/push/subscribe", {
    method: "POST",
    headers: {"content-type": "application/json"},
    body: JSON.stringify({endpoint: sub.endpoint}),
  });
  if (!r.ok) throw new Error(`subscribe: ${r.status}`);
}

function setupPush(reg) {
  const b = document.getElementById("bell");
  if (!("PushManager" in window) || !("Notification" in window)) return;
  const paint = () => {
    b.hidden = Notification.permission === "granted";
    b.dataset.state = Notification.permission;
    b.title = Notification.permission === "denied" ? "Notifikationer er blokeret for dette websted" : "Få gårsdagens tal som notifikation hver morgen";
  };
  paint();
  if (Notification.permission === "granted") {
    announce(reg).catch((e) => console.warn("webstat: push", e));
    return;
  }
  b.addEventListener("click", async () => {
    if ((await Notification.requestPermission()) === "granted") {
      try { await announce(reg); } catch (e) { console.warn("webstat: push", e); b.textContent = "Kunne ikke slå til"; b.hidden = false; return; }
    }
    paint();
  });
}

// See public/sw.js for what the worker does and does not cache. The Datastar
// bundle is versioned in the URL, so the worker learns it from the page.
if ("serviceWorker" in navigator) {
  addEventListener("load", async () => {
    try {
      await navigator.serviceWorker.register("/sw.js");
      const reg = await navigator.serviceWorker.ready;
      const ds = document.querySelector('script[type="module"][src*="datastar"]');
      if (ds) reg.active?.postMessage({type: "cache-asset", url: new URL(ds.src).pathname});
      setupPush(reg);
    } catch (e) {
      console.warn("webstat: no service worker", e);
    }
  });
}
</script>
</body>
</html>
