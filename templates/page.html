<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="module" src="{{ datastar_js }}"></script>
<meta name="robots" content="noindex">
<title>Webstat</title>
<style>
:root{--paper:#FBF8F1;--ink:#1E1C19;--muted:#6E675D;--rule:#E4DDD0;--red:#B3141C}
@media (prefers-color-scheme:dark){:root{--paper:#191816;--ink:#F1EDE4;--muted:#A39C90;--rule:#34312C;--red:#E0565C}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 Georgia,"Source Serif 4",serif}
main{max-width:64rem;margin:0 auto;padding:2rem 16px 4rem}
h1{font-size:2rem;margin:0 0 .25rem;letter-spacing:-.01em}
.sub{color:var(--muted);font:.85rem system-ui,sans-serif;margin-bottom:2rem}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;margin-bottom:2.5rem}
.tile{border-top:3px solid var(--ink);padding-top:.5rem}
.tile b{display:block;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font:.8rem system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:1fr;gap:2rem}
@media (min-width:800px){.grid{grid-template-columns:2fr 1fr}.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
h2{font-size:.8rem;font:700 .75rem system-ui,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--red);margin:0 0 .5rem}
table{width:100%;border-collapse:collapse;margin-bottom:2rem;font-size:.95rem}
td{padding:.35rem 0;border-bottom:1px solid var(--rule);vertical-align:baseline}
td.n{text-align:right;font-variant-numeric:tabular-nums;width:4.5rem;color:var(--muted)}
td.p{overflow-wrap:anywhere}
th{text-align:right;font:600 .7rem system-ui,sans-serif;color:var(--muted);padding:.25rem 0 .35rem .5rem;border-bottom:1px solid var(--rule)}
th:first-child{text-align:left;padding-left:0}
table.cols td.n{width:3.5rem;padding-left:.5rem}
td.t{color:var(--muted);font:.8rem system-ui,sans-serif;white-space:nowrap;width:3.5rem;text-align:left}
small{color:var(--muted);font:.75rem system-ui,sans-serif}
a{color:inherit}
.live{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:#2E9E5B;margin-right:.35rem;vertical-align:middle;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.empty{color:var(--muted)}
nav{display:flex;flex-wrap:wrap;gap:.25rem 1rem;font:.85rem system-ui,sans-serif;margin-bottom:.75rem}
nav a{color:var(--muted);text-decoration:none}
nav a[aria-current]{color:var(--ink);font-weight:600;border-bottom:2px solid var(--red)}
</style>
</head>
<body data-init="@get('/updates?site={{ site }}')" data-on:refresh="@get('/refresh?site={{ site }}')">
<main>
<h1>Webstat</h1>
{% if sites | length > 1 %}<nav>{% for s in sites %}<a href="/?site={{ s.id }}"{% if s.id == site %} aria-current="page"{% endif %}>{{ s.name }}</a>{% endfor %}</nav>{% endif %}
{{ board | safe }}
</main>
<script>
// The live stream can die silently (a phone leaving the screen, a sleeping
// laptop). Ask for the current board whenever the page comes back, and once
// a minute while it is visible; the patch is idempotent.
let last = 0;
const resync = () => {
  if (Date.now() - last < 500) return;
  last = Date.now();
  document.body.dispatchEvent(new CustomEvent("refresh", {bubbles: true}));
};
addEventListener("focus", resync);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") resync(); });
addEventListener("pageshow", (e) => { if (e.persisted) resync(); });
addEventListener("online", resync);
setInterval(() => { if (document.visibilityState === "visible") resync(); }, 60000);
</script>
</body>
</html>
