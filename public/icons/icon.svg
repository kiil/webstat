<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Webstat">
  <!-- Maskable source: the whole canvas is background, and the motif stays
       inside the 80% safe circle so a round or squircle mask cannot clip it.
       The bars are the dashboard's sparkline, today in red. -->
  <rect width="512" height="512" fill="#1E1C19"/>
  <g fill="#F1EDE4">
    <rect x="136" y="288" width="40" height="84" rx="4"/>
    <rect x="186" y="232" width="40" height="140" rx="4"/>
    <rect x="236" y="262" width="40" height="110" rx="4"/>
    <rect x="286" y="186" width="40" height="186" rx="4"/>
  </g>
  <rect x="336" y="130" width="40" height="242" rx="4" fill="#E0565C"/>
</svg>
